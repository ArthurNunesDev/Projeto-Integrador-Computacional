spring.application.name=MarketFaesa
server.error.include-stacktrace=never
server.error.include-message=never

# Banco de dados (PostgreSQL no Neon). Os valores vem de variaveis de ambiente
# ou do perfil local (application-local.properties, ver o .example em backend/).
# Os padroes vazios (":}") existem para os testes, que trocam o DataSource por
# PostgresDeTeste; sem as variaveis, a aplicacao nao sobe (sem URL de banco).
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Flyway usa a conexao direta (sem pooler) quando DATABASE_DIRECT_URL existir
spring.flyway.url=${DATABASE_DIRECT_URL:${DATABASE_URL:}}
spring.flyway.user=${DATABASE_USERNAME:}
spring.flyway.password=${DATABASE_PASSWORD:}

# O schema e criado so pelas migrations do Flyway; o Hibernate apenas confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (HS256). JWT_SECRET precisa ter pelo menos 32 bytes; sem ele a aplicacao
# nao sobe. Gere um com: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao=${JWT_EXPIRACAO:24h}

# Origens liberadas no CORS, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://arthurnunesdev.github.io,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

# Limite de tentativas. Login: erros por par IP e e-mail. Cadastro: tentativas por IP.
# Sobrescreva por variavel de ambiente (ex.: APP_LIMITE_LOGIN_MAXIMO, APP_LIMITE_CADASTRO_JANELA).
app.limite.login.maximo=5
app.limite.login.janela=15m
app.limite.cadastro.maximo=30
app.limite.cadastro.janela=1h
# Teto de contadores guardados em memoria, por limite
app.limite.maximo-entradas=50000

# IP do cliente. Com "none", o IP e o da conexao TCP e o X-Forwarded-For e ignorado: seguro, mas atras do proxy de
# um host todos os clientes parecem ter o IP do proxy e o limite vira global. Ao hospedar atras de proxy, defina
# SERVER_FORWARD_HEADERS_STRATEGY=native: o Tomcat so le o header quando a conexao vem de um proxy confiavel
# (server.tomcat.remoteip.internal-proxies, por padrao as faixas privadas) e usa o ultimo IP nao confiavel da lista,
# que o cliente nao consegue forjar. Nao use "framework": ele confia no primeiro IP do header, que e forjavel.
server.forward-headers-strategy=none
