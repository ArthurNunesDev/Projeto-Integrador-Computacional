# Sobrescreve propriedades so nos testes. Fica em config/ (e nao na raiz do
# classpath) para nao esconder o application.properties principal: o Spring Boot
# carrega os dois, e este tem prioridade.
app.jwt.secret=segredo-de-teste-com-pelo-menos-32-bytes-0123456789

# Toda a suite usa o mesmo IP (127.0.0.1) e cadastra muitas contas. Os testes do limite baixam estes valores.
app.limite.login.maximo=100000
app.limite.cadastro.maximo=100000
